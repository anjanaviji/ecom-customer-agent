[project]
name = "customer-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshay Siv", email = "akshaysiv95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
customer-agent = "customer_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]
